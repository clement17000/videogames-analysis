name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Lint (ruff check + format)
  # Vérifie la qualité du code avant de lancer les tests.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Check code style (ruff format)
        run: uv run ruff format --check dags/ tests/

      - name: Check linting rules (ruff check)
        run: uv run ruff check dags/ tests/

  # ---------------------------------------------------------------------------
  # Job 2 — Tests (pytest)
  # Lance les tests unitaires uniquement si le lint passe.
  # Aucune connexion Snowflake requise — tous les appels externes sont mockés.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short
