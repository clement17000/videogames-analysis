version: 2

models:
  - name: stg__rawg_games
    description: >
      Table de staging (couche Silver) pour les données principales des jeux vidéo 
      issues de l'API RAWG via dlt. 
      Les types ont été standardisés, et les anomalies de Business Logic
      ainsi que les outliers de temps de jeu ont été nettoyés et passés à NULL.
    
    columns:
      - name: game_id
        description: "Identifiant unique du jeu fourni par l'API RAWG (Clé business)."
        tests:
          - unique
          - not_null

      - name: game_name
        description: "Nom complet du jeu vidéo."
        tests:
          - not_null

      - name: slug
        description: "Slug textuel unique du jeu utilisé pour les URLs de l'API."

      - name: esrb_rating
        description: "Classification de l'âge (ex: Mature, Teen, Everyone) renvoyée par l'organisme ESRB."

      - name: metacritic_score
        description: "Score de critique média officiel Metacritic. Les valeurs aberrantes (< 0 ou > 100) ont été nettoyées à NULL dans la couche Silver."

      - name: user_rating
        description: "Note moyenne attribuée par les utilisateurs de RAWG."

      - name: max_user_rating
        description: "Note maximale possible pour ce jeu (échelle du rating)."

      - name: ratings_count
        description: "Nombre total de votes d'utilisateurs enregistrés pour ce jeu."

      - name: average_playtime_hours
        description: "Temps de jeu moyen en heures. Les valeurs aberrantes (outliers > 8760h soit 1 an de jeu non-stop) ont été purgées à NULL."

      - name: release_date
        description: "Date de sortie officielle du jeu au format YYYY-MM-DD."

      - name: updated_at
        description: "Horodatage de la dernière mise à jour de la fiche du jeu dans l'API RAWG."